<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12"><title>Mibs Console — Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="modulepreload" href="protocol.js"><link rel="modulepreload" href="games.js"><link rel="modulepreload" href="room.js"><link rel="modulepreload" href="firebase-config.js">
<link rel="stylesheet" href="controller.css">
</head><body>
<div id="join">
  <h1>Join a game</h1>
  <input id="room" maxlength="4" placeholder="Room code" autocapitalize="characters" autocomplete="off" inputmode="text" aria-label="Room code">
  <input id="name" maxlength="12" placeholder="Your nickname" autocomplete="off" aria-label="Your nickname">
  <button class="b" id="go">Join game</button>
  <div id="err" role="alert"></div>
</div>
<div id="app" hidden>
  <div class="top"><span class="dot" id="dot"></span><span id="me"></span><span id="ping"></span><span class="grow"></span>
    <button class="b small" id="ex" hidden>Exit game</button><button class="b small" id="lv">Leave</button><button class="b small" id="fs" title="Fullscreen">⛶</button></div>
  <div id="banner" hidden role="status"></div>
  <div id="view"></div>
</div>
<div id="rotate"><b>↻</b><h2>Turn your phone sideways</h2><p>Mibs Console is played in landscape.</p></div>
<script type="module" src="controller.js"></script>
<noscript>Mibs Console needs JavaScript.</noscript>
</body></html>
