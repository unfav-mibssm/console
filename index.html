<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd84d"><title>Mibs Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--ink:#1d1b2f;--bg:#ffd84d;--p1:#2f6df6}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;background:var(--bg);color:var(--ink);font:500 18px/1.35 Fredoka,system-ui,sans-serif;display:grid;place-items:center;padding:20px}
main{width:min(100%,460px);display:flex;flex-direction:column;gap:18px}
h1{font-size:42px;text-align:center;line-height:1.05}
.sub{text-align:center}
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:20px;display:flex;flex-direction:column;gap:12px;color:inherit;text-decoration:none}
h2{font-size:22px}
input{font:inherit;font-size:22px;padding:14px;border:3px solid var(--ink);border-radius:14px;text-align:center;width:100%}
#room{text-transform:uppercase;letter-spacing:8px;font-size:28px}
button{font:inherit;font-weight:700;font-size:22px;padding:14px;border:3px solid var(--ink);border-radius:16px;background:var(--p1);color:#fff;box-shadow:0 5px 0 var(--ink);cursor:pointer}
button:active,.tv:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tv p{font-size:16px}
</style></head><body><main>
<h1>Mibs Console</h1>
<p class="sub">Couch games for two. One screen, two phones.</p>
<form class="card" id="f"><h2>📱 Play on this phone</h2>
<input id="room" maxlength="4" placeholder="Room code" autocapitalize="characters" autocomplete="off" required>
<input id="name" maxlength="12" placeholder="Your nickname" autocomplete="off">
<button>Join game</button></form>
<a class="card tv" href="tv.html"><h2>🖥️ Show the TV screen</h2><p>Open this on the TV or laptop. It shows the room code to type in.</p></a>
</main>
<script>
const $ = s => document.querySelector(s);
$("#name").value = sessionStorage.name || "";
$("#room").oninput = e => { e.target.value = e.target.value.replace(/[^a-z]/gi, "").toUpperCase(); if (e.target.value.length === 4) $("#name").focus(); };
$("#f").onsubmit = e => { e.preventDefault(); sessionStorage.room = $("#room").value.trim().toUpperCase(); sessionStorage.name = $("#name").value.trim() || "Player"; location.href = "controller.html"; };
</script></body></html>
