<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12"><title>Mibs Console — Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><link rel="modulepreload" href="kit.js"><link rel="modulepreload" href="games.js"><link rel="modulepreload" href="firebase-config.js"><style>
:root{--ink:#1d1b2f;--bg:#ffd84d;--c:#2f6df6;--ok:#22c55e}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--ink);font:500 18px/1.3 Fredoka,system-ui,sans-serif}
body{height:100dvh;width:100vw;overflow:hidden;position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#join,#app{height:100%;display:flex;flex-direction:column;gap:14px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#app{background:var(--c);color:#fff}
#join{justify-content:center}
#join h1{text-align:center;font-size:34px}
input{font:inherit;font-size:22px;padding:16px;border-radius:16px;border:3px solid var(--ink);background:#fff;color:var(--ink);text-align:center;user-select:text;-webkit-user-select:text;touch-action:auto}
#room{text-transform:uppercase;letter-spacing:10px;font-size:30px}
#err{color:#b00020;min-height:1.2em;text-align:center;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
#ping{font-size:14px;font-weight:500;opacity:.85}
#view{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.card{padding:20px;border:3px solid var(--ink);border-radius:20px;text-align:center;background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.card h1{font-size:30px}.card p{font-size:16px;margin-top:6px}
.row{display:flex;gap:14px}.row .b{flex:1}
.b{font:inherit;font-weight:700;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:22px;padding:18px;touch-action:none;box-shadow:0 6px 0 var(--ink)}
.b.on{transform:translateY(5px);box-shadow:0 1px 0 var(--ink);background:var(--ink);color:#fff}
.b:disabled{opacity:.4}
.go{flex:1;background:var(--ok);font-size:30px}
#go{background:var(--c);color:#fff}
.small{padding:6px 12px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.pad{flex:1;position:relative;display:flex;gap:14px;min-height:0}
.pad .b{flex:1;font-size:30px}
.single-button .b{font-size:54px}
.dpad-fire{display:grid;grid-template-columns:repeat(3,1fr) 1.5fr;grid-template-rows:repeat(3,1fr)}
.dpad-fire [data-k=up]{grid-area:1/2}.dpad-fire [data-k=left]{grid-area:2/1}.dpad-fire [data-k=right]{grid-area:2/3}.dpad-fire [data-k=down]{grid-area:3/2}
.dpad-fire [data-k=btnA]{grid-area:1/4/4/5}
#app{background-image:radial-gradient(#ffffff26 2px,transparent 2.5px);background-size:26px 26px}
.b:focus-visible,input:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.go:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
@media(max-height:480px){.top{font-size:13px}.top .small{padding:2px 8px;box-shadow:0 2px 0 var(--ink)}.card{padding:10px}#app{gap:6px}}
.up-down{flex-direction:column}.up-down .b{font-size:44px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="join">
  <h1>Join a game</h1>
  <input id="room" maxlength="4" placeholder="Room code" autocapitalize="characters" autocomplete="off">
  <input id="name" maxlength="12" placeholder="Your nickname" autocomplete="off">
  <button class="b" id="go">Join game</button>
  <div id="err"></div>
</div>
<div id="app" hidden>
  <div class="top"><span id="me"></span><span id="ping"></span><button class="b small" id="ex" hidden>Exit game</button><button class="b small" id="fs">⛶ Fullscreen</button></div>
  <div id="view"></div>
</div>
<script type="module">
import { loadGames } from "./games.js";
const GR = await loadGames();
import { db, ref, get, set, update, onValue, onDisconnect, runTransaction } from "./firebase-config.js";
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const sid = (sessionStorage.sid ||= crypto.randomUUID?.() || Math.random().toString(36).slice(2) + Date.now());
const COL = { p1: "#2f6df6", p2: "#ff4f6d" }, OFF = { up: false, down: false, left: false, right: false, btnA: false };
const LAYOUTS = {
  "single-button": [{ k: "btnA", t: "tapA", label: "Action" }],
  "left-right": [{ k: "left", t: "tapLeft", label: "Turn left" }, { k: "right", t: "tapRight", label: "Turn right" }],
  "up-down": [{ k: "up", label: "▲ Up" }, { k: "down", label: "▼ Down" }],
  "dpad-fire": [{ k: "up", label: "▲" }, { k: "left", t: "tapLeft", label: "◀" }, { k: "right", t: "tapRight", label: "▶" }, { k: "down", label: "▼" }, { k: "btnA", t: "tapA", label: "Fire" }]
}; // "custom": the game supplies controllerButtons: [{k, t?, label, style?}]
let room, slot, R, key, base, inRef, held = {}, taps = { tapLeft: 0, tapRight: 0, tapA: 0 };
const err = m => $("#err").textContent = m || "";
const leave = m => { alert(m); sessionStorage.removeItem("room"); location.href = location.pathname; };
addEventListener("contextmenu", e => e.preventDefault());

$("#room").value = (new URLSearchParams(location.search).get("room") || sessionStorage.room || "").toUpperCase().slice(0, 4);
$("#name").value = sessionStorage.name || "";
$("#go").onclick = join;
if ($("#room").value && sessionStorage.name && sessionStorage.room === $("#room").value) join();

async function join() {
  const code = $("#room").value.trim().toUpperCase(), name = ($("#name").value.trim() || "Player").slice(0, 12);
  err(""); slot = null;
  if (code.length !== 4) return err("Enter the 4-letter room code.");
  try {
    if (!(await get(ref(db, "rooms/" + code))).exists()) return err("Room not found. Check the code on the TV.");
    outer: for (const steal of [false, true]) for (const s of ["p1", "p2"]) {
      const r = await runTransaction(ref(db, `rooms/${code}/players/${s}`), c => (!c || c.sessionId === sid || (steal && c.connected === false)) ? { sessionId: sid, name, connected: true } : undefined);
      if (r.committed) { slot = s; break outer; }
    }
    if (!slot) return err("This room is full.");
  } catch (e) { return err("Could not join: " + e.message); }
  room = code; sessionStorage.room = code; sessionStorage.name = name;
  $("#join").hidden = true; $("#app").hidden = false; $("#me").textContent = `P${slot[1]} · ${name}`;
  document.documentElement.style.setProperty("--c", COL[slot]);
  start();
}

function start() {
  base = `rooms/${room}`; inRef = ref(db, `${base}/inputs/${slot}`);
  const me = ref(db, `${base}/players/${slot}`), conn = ref(db, `${base}/players/${slot}/connected`);
  // Reconnection: fires on first connect and every time the phone wakes up / regains network.
  onValue(ref(db, ".info/connected"), async s => {
    if (!s.val()) return;
    const p = (await get(me)).val();
    if (!p) return; if (p.sessionId !== sid) return leave("Someone else took your seat in this room."); // slot gone (room closed) or taken by someone else
    await onDisconnect(conn).set(false);
    await set(conn, true);
    const c = (await get(inRef)).val() || {};
    for (const k in taps) taps[k] = c[k] | 0; // resume tap counters
    await update(inRef, OFF); key = null; draw(); // clear any stuck buttons and rebuild the controls
  });
  onValue(ref(db, base), s => { R = s.val(); if (!R) return leave("The TV closed this room."); draw(); }); // one listener: status and game always arrive together
  wake();
}

function draw() {
  if (!R?.status) return;
  const p = R.players || {}, n = GR.length, i = Math.min(Math.max(R.selectedLobbyIndex | 0, 0), n - 1), st = R.status, boss = slot === "p1";
  const g = GR.find(x => x.id === R.activeGame) || GR[0], rdy = !!(p.p1?.connected && p.p2?.connected);
  const gm = st === "countdown" || st === "playing", k = gm ? "game|" + R.activeGame : st === "lobby" ? ["lobby", i, rdy].join("|") : [st, R.winner, R.scores?.p1, R.scores?.p2].join("|");
  if (k === key) return; key = k; $("#ex").hidden = !gm; // other player's button presses must not rebuild my UI
  held = {}; update(inRef, OFF);
  const v = $("#view"), B = ref(db, base);
  if (st === "countdown" || st === "playing") return controls(v, g);
  if (st === "lobby") {
    v.innerHTML = boss
      ? `<div class="card"><small>Game ${i + 1} of ${n}</small><h1>${esc(GR[i].icon || "🎮")} ${esc(GR[i].title)}</h1><p>${esc(GR[i].description)}</p></div>
         <div class="row"><button class="b" id="pv">Previous game</button><button class="b" id="nx">Next game</button></div>
         <button class="b go" id="st" ${rdy ? "" : "disabled"}>${rdy ? "Start game" : "Waiting for Player 2…"}</button>`
      : `<div class="card"><h1>${esc(p[slot]?.name || "")}</h1><p>You are Player 2. Waiting for Player 1 to choose a game...</p></div>`;
    if (boss) {
      $("#pv").onclick = () => update(B, { selectedLobbyIndex: (i + n - 1) % n });
      $("#nx").onclick = () => update(B, { selectedLobbyIndex: (i + 1) % n });
      $("#st").onclick = () => update(B, { status: "countdown", activeGame: GR[i].id, winner: null });
    }
  } else if (st === "gameover") {
    const w = R.winner, res = w === "draw" ? "Draw" : w === slot ? "You win!" : "You lose";
    v.innerHTML = `<div class="card"><h1>${res}</h1><p>Session wins — P1 ${R.scores?.p1 | 0} · P2 ${R.scores?.p2 | 0}</p></div>` +
      (boss ? `<button class="b go" id="pa">Play again</button><button class="b" id="bl">Back to lobby</button>` : `<div class="card"><p>Waiting for Player 1…</p></div>`);
    if (boss) {
      $("#pa").onclick = () => update(B, { status: "countdown", winner: null });
      $("#bl").onclick = () => update(B, { status: "lobby", winner: null });
    }
  }
}

function controls(v, g) {
  const L = LAYOUTS[g.controllerLayout] || g.controllerButtons || [], lab = g.controllerLabels || {};
  v.innerHTML = `<div class="pad ${esc(g.controllerLayout)}"></div>`;
  for (const b of L) {
    const el = document.createElement("button"); el.className = "b"; el.dataset.k = b.k; el.textContent = lab[b.k] || b.label;
    if (b.style) el.style.cssText = b.style;
    v.firstChild.append(el); bind(el, b);
  }
}

// Multi-touch: each button tracks its own pointerIds; a press writes the boolean AND bumps the tap counter.
function bind(el, b) {
  const ids = (held[b.k] = new Set()), push = down => {
    const o = { [b.k]: down };
    if (down && b.t) o[b.t] = taps[b.t] = (taps[b.t] + 1) % 10000;
    const t0 = performance.now(); update(inRef, o).then(() => $("#ping").textContent = Math.round(performance.now() - t0) + " ms");
  };
  el.addEventListener("pointerdown", e => {
    e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch {}
    if (!ids.size) { el.classList.add("on"); navigator.vibrate?.(25); push(true); }
    ids.add(e.pointerId);
  });
  const up = e => { if (ids.delete(e.pointerId) && !ids.size) { el.classList.remove("on"); push(false); } };
  ["pointerup", "pointercancel", "pointerleave", "lostpointercapture"].forEach(t => el.addEventListener(t, up));
}

async function wake() { try { await navigator.wakeLock.request("screen"); } catch {} }
const releaseAll = () => { for (const k in held) held[k].clear(); document.querySelectorAll(".pad .b.on").forEach(el => el.classList.remove("on")); if (inRef) update(inRef, OFF); };
addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); releaseAll(); });
let exT; $("#ex").onclick = e => {
  const b = e.currentTarget; clearTimeout(exT);
  if (b.dataset.arm) { b.dataset.arm = ""; b.textContent = "Exit game"; update(ref(db, base), { status: "lobby", winner: null }); }
  else { b.dataset.arm = "1"; b.textContent = "Tap again to exit"; exT = setTimeout(() => { b.dataset.arm = ""; b.textContent = "Exit game"; }, 3000); }
};
$("#fs").onclick = () => {
  const d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen;
  if (f) f.call(d)?.catch?.(() => {}); else alert("On iPhone: tap Share → Add to Home Screen to play fullscreen.");
};
</script>
</body></html>
